version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: swms_db
    environment:
      POSTGRES_DB: swms_db
      POSTGRES_USER: swms_user
      POSTGRES_PASSWORD: swms_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swms_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: